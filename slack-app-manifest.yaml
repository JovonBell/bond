# Paste this into Slack: api.slack.com/apps → Create New App → From a manifest → YAML
# Replace YOUR-RAILWAY-URL with your real Railway URL after deploying.

display_information:
  name: Pulse
  description: AI coworker that lives in your Slack and connects to 7,000+ tools
  background_color: "#4A154B"
features:
  bot_user:
    display_name: Pulse
    always_online: true
oauth_config:
  redirect_urls:
    - https://YOUR-RAILWAY-URL.up.railway.app/slack/oauth_redirect
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - im:read
      - im:write
      - users:read
      - commands
settings:
  event_subscriptions:
    request_url: https://YOUR-RAILWAY-URL.up.railway.app/slack/events
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://YOUR-RAILWAY-URL.up.railway.app/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
