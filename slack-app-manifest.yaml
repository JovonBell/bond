# Paste this into Slack: api.slack.com/apps → Pulse → App Manifest (YAML)
# Production URL is bond-production-efa5.up.railway.app — already set below.

display_information:
  name: Pulse
  description: AI coworker that lives in your Slack and connects to 7,000+ tools
  background_color: "#4A154B"
features:
  bot_user:
    display_name: Pulse
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  redirect_urls:
    - https://bond-production-efa5.up.railway.app/slack/oauth_redirect
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - im:read
      - im:write
      - users:read
      - commands
      - reactions:write
settings:
  event_subscriptions:
    request_url: https://bond-production-efa5.up.railway.app/slack/events
    bot_events:
      - app_mention
      - message.im
      - app_home_opened
  interactivity:
    is_enabled: true
    request_url: https://bond-production-efa5.up.railway.app/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
