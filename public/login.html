<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#000" />
  <title>Pulse · Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #000; color: #FAFAFA;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh; overflow: hidden;
    }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; }

    /* Animated nebula */
    body::before {
      content: ''; position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 90vmin; height: 90vmin;
      background: radial-gradient(circle,
        rgba(139, 92, 246, 0.30) 0%,
        rgba(59, 130, 246, 0.15) 35%,
        transparent 65%);
      filter: blur(60px);
      animation: breathe 8s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    }

    /* Star field */
    body::after {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 12% 28%, #fff, transparent 50%),
        radial-gradient(1px 1px at 65% 72%, #fff, transparent 50%),
        radial-gradient(1.5px 1.5px at 88% 15%, #fff, transparent 50%),
        radial-gradient(1px 1px at 25% 85%, rgba(139,92,246,0.8), transparent 50%),
        radial-gradient(1.5px 1.5px at 75% 35%, rgba(59,130,246,0.7), transparent 50%),
        radial-gradient(1px 1px at 45% 50%, #fff, transparent 50%),
        radial-gradient(1px 1px at 8% 65%, #fff, transparent 50%);
      background-size: 100vw 100vh;
      opacity: 0.7;
    }

    .nav-logo {
      position: fixed; top: 24px; left: 28px;
      display: flex; align-items: center; gap: 10px;
      font-weight: 800; font-size: 18px; letter-spacing: -0.5px;
      z-index: 10;
    }
    .logo-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #14F195;
      box-shadow: 0 0 14px #14F195;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    .card {
      position: relative; z-index: 2;
      max-width: 440px; width: 100%;
      background: rgba(12, 12, 14, 0.65);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 44px 36px;
      text-align: center;
      box-shadow:
        0 20px 80px rgba(0,0,0,0.7),
        0 0 100px rgba(139, 92, 246, 0.18);
      animation: card-in 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mini galaxy at the top */
    .mini-galaxy {
      position: relative;
      width: 90px; height: 90px;
      margin: 0 auto 28px;
    }
    .mini-orb {
      position: absolute; left: 50%; top: 50%;
      width: 44px; height: 44px;
      margin: -22px 0 0 -22px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 28%, #fff 0%, #B49BFF 18%, #8B5CF6 50%, #3B82F6 100%);
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.9), 0 0 60px rgba(139, 92, 246, 0.5);
      animation: orb-pulse 3s ease-in-out infinite;
    }
    @keyframes orb-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .mini-galaxy::before, .mini-galaxy::after {
      content: ''; position: absolute; inset: 0;
      border: 1px dashed rgba(255,255,255,0.12);
      border-radius: 50%;
    }
    .mini-galaxy::after {
      inset: 14px;
      border-color: rgba(139, 92, 246, 0.25);
    }

    h1 {
      font-size: 32px; font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 12px;
    }
    .tagline {
      color: #999; font-size: 15px; line-height: 1.5;
      margin-bottom: 32px;
    }

    .btn-slack {
      display: inline-flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%;
      background: #4A154B; color: #fff;
      border: none; padding: 14px 22px;
      border-radius: 12px;
      font-family: inherit; font-size: 15px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: all 0.15s ease;
      box-shadow: 0 8px 30px rgba(74, 21, 75, 0.5);
    }
    .btn-slack:hover { background: #3a103b; transform: translateY(-1px); box-shadow: 0 12px 40px rgba(74, 21, 75, 0.7); }

    .divider {
      display: flex; align-items: center; gap: 12px;
      color: #444; font-size: 12px; margin: 24px 0; text-transform: uppercase; letter-spacing: 1px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.08);
    }

    .install-link {
      display: block; text-align: center;
      color: #999; font-size: 13px;
      text-decoration: none;
      padding: 12px;
      transition: color 0.15s ease;
    }
    .install-link:hover { color: #fff; }
    .install-link b { color: #fff; }

    .meta {
      margin-top: 28px;
      font-size: 12px; color: #444;
      line-height: 1.5;
    }
    .meta a { color: #888; text-decoration: none; }
    .meta a:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="nav-logo">
    <span class="logo-dot"></span>
    pulse
  </div>

  <div class="card">
    <div class="mini-galaxy">
      <div class="mini-orb"></div>
    </div>

    <h1>Welcome to Pulse</h1>
    <p class="tagline">Sign in to manage your AI coworker's connected tools.</p>

    <a class="btn-slack" href="/auth/slack/start">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M5 15a2 2 0 11-2-2h2v2zm1 0a2 2 0 114 0v5a2 2 0 11-4 0v-5zm2-8a2 2 0 11-2-2V3a2 2 0 114 0v2H8zm0 1a2 2 0 110 4H3a2 2 0 110-4h5zm8 2a2 2 0 112 2h-2V8zm-1 0a2 2 0 11-4 0V3a2 2 0 114 0v5zm-2 8a2 2 0 112 2v2a2 2 0 11-4 0v-2h2zm0-1a2 2 0 110-4h5a2 2 0 110 4h-5z"/>
      </svg>
      Sign in with Slack
    </a>

    <div class="divider">or</div>

    <a class="install-link" href="/slack/install">
      <b>First time?</b> Install Pulse to your workspace →
    </a>

    <div class="meta">
      Pulse only reads your Slack identity (name, email, workspace) to sign you in.<br>
      <a href="/">← Back to home</a>
    </div>
  </div>
</body>
</html>
